<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Your Product</title>
</head>

<body>
    <div style="display: flex; justify-content: space-around; align-items: center; height: 100vh;">

        <div>
            <h3 onclick="newProductAdd">Added Products List</h3>

        </div>

        <div style="text-align: center;">
            <h1>Add Product</h1>
            <input type="text" id="name" placeholder="Product Name"><br><br>
            <input type="text" id="sku" placeholder="SKU"><br><br>
            <input type="number" id="qty" placeholder="Quantity"><br><br>
            <input type="number" id="price" placeholder="Price"><br><br>

            <button onclick="newProductAdd()">Add Product</button>
        </div>

    </div>
</body>
<script src="newPoductAdd.js"></script>
</html>
