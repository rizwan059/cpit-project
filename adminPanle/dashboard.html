<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* HEADER */
        .header {
            height: 60px;
            background: #2c3e50;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .header nav a {
            color: white;
            margin-left: 20px;
            text-decoration: none;
        }

        /* MAIN LAYOUT */
        .container {
            display: flex;
            height: calc(100vh - 60px);
        }

        /* SIDEBAR */
        .sidebar {
            width: 220px;
            background: #34495e;
            color: white;
            padding: 20px;
        }

        .sidebar h3 {
            margin-bottom: 20px;
        }

        .sidebar button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: none;
            background: #1abc9c;
            color: white;
            cursor: pointer;
        }

        .sidebar button:hover {
            background: black;
        }

        /* CONTENT */
        .content {
            flex: 1;
            padding: 20px;
        }

        /* TABLE */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }
    </style>

</head>

<body>

    <!-- 🔐 LOGIN CHECK -->
    <script>
        if (localStorage.getItem("isLoggedIn") !== "true") {
            window.location.href = "login.html";
        }
    </script>

    <!-- HEADER -->
    <div class="header">
        <h2>Admin Panel</h2>
        <nav>
            <a href="#">Home</a>
            <a href="#">Contact</a>
            <a href="#">Account</a>
            <a href="#" onclick="logout()">Logout</a>
        </nav>
    </div>

    <!-- MAIN -->
    <div class="container">

        <!-- SIDEBAR -->
        <div class="sidebar">
            <h3>Menu</h3>
            <button onclick="showAddProduct()">Add Product</button>
            <button onclick="showProducts()">View Products</button>
            <button onclick="showProducts()">Edit Product</button>
            <button onclick="showProducts()">Delete Product</button>
            <button onclick="showProducts()">Add User</button>
            <button onclick="showProducts()">Edit User</button>
            <button onclick="showProducts()">Delete User</button>
        </div>

        <!-- CONTENT -->
        <div class="content" id="contentArea">
            <h2>Welcome to Dashboard</h2>
        </div>

    </div>
    <script></script>
</body>

</html>
