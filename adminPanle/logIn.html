<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    display: flex;
    height: 100vh;
}

/* LEFT SIDE (FORM) */
.left {
    width: 50%;
    padding: 80px;
    background: #f5f5f5;
}

.left h1 {
    font-size: 40px;
    margin-bottom: 10px;
}

.left p {
    color: gray;
    margin-bottom: 40px;
}

/* INPUTS */
.input-group {
    margin-bottom: 20px;
}

.input-group label {
    display: block;
    margin-bottom: 5px;
}

.input-group input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ccc;
}

/* ROW (remember + forgot) */
.row {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin-bottom: 20px;
}

/* BUTTONS */
.btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #e74c3c;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.btn:hover {
    background: black;
}

/* GOOGLE BUTTON */
.google-btn {
    margin-top: 15px;
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ccc;
    background: white;
    cursor: pointer;
}

/* SIGNUP TEXT */
.signup {
    margin-top: 15px;
    font-size: 14px;
}

.signup span {
    color: red;
    cursor: pointer;
}

/* RIGHT SIDE (IMAGE) */
.right {
    width: 50%;
    height: 100vh;
}

.right img {
    width: 100%;
    height: 99%;
    object-fit: cover;

}
</style>

</head>

<body>

<!-- LEFT -->
<div class="left">
    <h1>WELCOME BACK</h1>
    <p>Welcome back! Please enter your details.</p>

    <div class="input-group">
        <label>Email</label>
        <input type="text" placeholder="Enter your email" id="user">
    </div>

    <div class="input-group">
        <label>Password</label>
        <input type="password" placeholder="********" id="password">
    </div>

    <div class="row">
        <div>
            <input type="checkbox"> Remember me
        </div>
        <div>Forgot password</div>
    </div>

    <button class="btn" onclick="adminLogin()">Sign in</button>

    <button class="google-btn">Sign in with Google</button>

    <div class="signup">
        Don’t have an account? <span>Sign up for free!</span>
    </div>
</div>

<!-- RIGHT -->
<div class="right">
    <img src="RightSide.png" alt="image">
</div>

</body>
<script src="script.js"></script>
</html>
